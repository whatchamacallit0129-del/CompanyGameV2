name: Cline

on:
  workflow_dispatch:

jobs:
  cline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm install -g cline

      - name: Check Cline CLI
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: cline --version
