name: Cline

on:
  push:
    paths:
      - 'agent-queue/pending/**'
  workflow_dispatch:

jobs:
  cline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm install -g cline

      - name: Run queued Cline task
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: |
          TASK_FILE=$(find agent-queue/pending -maxdepth 1 -type f | sort | head -n 1)
          if [ -z "$TASK_FILE" ]; then
            echo "No pending Cline task found."
            exit 0
          fi
          echo "Running task from: $TASK_FILE"
          cline --auto-approve true -k "$CLINE_API_KEY" "$(cat "$TASK_FILE")"
